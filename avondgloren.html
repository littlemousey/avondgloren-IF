<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avondgloren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #352c4a;
    --bg-deep-2: #4a3a5e;
    --parchment: #ece0c4;
    --parchment-dim: #ddceaa;
    --ink: #26200f;
    --ink-soft: #524a30;
    --ember: #d97a3d;
    --ember-deep: #a8552a;
    --violet: #a68fc9;
    --moss: #7c9b6b;
    --rule: rgba(38,32,15,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 700px 420px at 50% -5%, rgba(217,122,61,0.22), transparent 60%),
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-deep-2), transparent),
      var(--bg-deep);
    min-height:100vh;
    font-family:'Lora', serif;
    color: var(--parchment);
    padding: 48px 20px 80px;
    display:flex;
    justify-content:center;
  }
  .wrap{ width:100%; max-width: 780px; }
  header{ text-align:center; margin-bottom: 28px; }
  .mark{ width:46px; height:46px; margin: 0 auto 6px; position:relative; }
  .mark svg{ width:100%; height:100%; overflow:visible; }
  .spark{ stroke: var(--ember); stroke-width: 2.2; fill:none; stroke-linecap: round; opacity: 0.8; transform-origin: center; animation: flicker 2.6s ease-in-out infinite; }
  .spark.s2{ animation-delay: 0.7s; opacity:0.55; }
  .spark.s3{ animation-delay: 1.4s; opacity:0.35; }
  @keyframes flicker{
    0%{ transform: scale(1) translateY(0); opacity:0.3; }
    30%{ opacity:0.85; }
    60%{ transform: scale(1.08) translateY(-3px); }
    100%{ transform: scale(1) translateY(0); opacity:0.3; }
  }
  h1{ font-family:'Fraunces', serif; font-weight: 500; font-size: 34px; margin: 0; color: var(--parchment); }
  .subtitle{ font-style: italic; font-size: 14px; color: var(--ember); margin-top: 4px; letter-spacing: 0.04em; }
  .daytag{ font-size: 11px; text-transform:uppercase; letter-spacing:0.14em; color: var(--parchment-dim); margin-top:10px; opacity:0.7;}
  .layout{ display:grid; grid-template-columns: 1fr 210px; gap: 22px; align-items:start; }
  @media (max-width: 620px){
    .layout{ grid-template-columns: 1fr; }
    .sidebar{ order: 2; }
    body{ padding: 24px 12px 48px; }
    header{ margin-bottom: 18px; }
    h1{ font-size: 26px; }
    .subtitle{ font-size: 13px; }
    .page{ padding: 22px 18px; }
    .story-text{ font-size: 16px; line-height: 1.65; }
    .choice-btn{ padding: 14px 16px; }
    .side-card{ padding: 14px; }
  }
  .page{ background: var(--parchment); color: var(--ink); border-radius: 6px; padding: 36px 38px; box-shadow: 0 18px 40px rgba(0,0,0,0.35); position: relative; }
  .page::before{ content:""; position:absolute; inset:10px; border: 1px solid rgba(38,32,15,0.12); border-radius: 3px; pointer-events:none; }
  .scene-label{ font-family:'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ember-deep); margin: 0 0 10px; }
  .story-text{ font-size: 17px; line-height: 1.75; margin: 0 0 26px; }
  .story-text p{ margin: 0 0 14px; }
  .story-text p:last-child{ margin-bottom:0; }
  .choices{ display:flex; flex-direction:column; gap:10px; border-top: 1px solid var(--rule); padding-top: 20px; }
  .choice-btn{ text-align:left; background: transparent; border: 1px solid rgba(38,32,15,0.3); border-radius: 4px; padding: 12px 16px; font-family:'Lora', serif; font-size: 15px; color: var(--ink); cursor:pointer; transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease; }
  .choice-btn:hover{ background: rgba(217,122,61,0.14); border-color: var(--ember-deep); }
  .choice-btn:active{ transform: scale(0.99); }
  .choice-btn .leaf{ color: var(--moss); margin-right: 8px; font-style: italic; }
  .restart-row{ margin-top: 22px; text-align:center; }
  .restart-btn{ background:none; border:none; color: var(--ember); font-family:'Lora', serif; font-style: italic; font-size: 14px; cursor:pointer; text-decoration: underline; text-underline-offset: 3px; opacity: 0.85; }
  .restart-btn:hover{ opacity:1; }
  .sidebar{ display:flex; flex-direction:column; gap:16px; }
  .side-card{ background: rgba(236,224,196,0.06); border: 1px solid rgba(236,224,196,0.16); border-radius: 6px; padding: 16px; }
  .side-title{ font-family:'Fraunces', serif; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ember); margin: 0 0 10px; }
  .glow-track{ height: 8px; border-radius: 5px; background: rgba(236,224,196,0.15); overflow:hidden; margin-bottom: 6px; }
  .glow-fill{ height:100%; background: linear-gradient(90deg, var(--violet), var(--ember)); width: 0%; transition: width 0.5s ease; }
  .glow-label{ font-size: 12px; color: var(--parchment-dim); }
  .journal-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .journal-list li{ font-size: 13px; font-style: italic; color: var(--parchment-dim); padding-left: 14px; position: relative; }
  .journal-list li.spell::before{ content:"✦"; position:absolute; left:0; color: var(--violet); }
  .journal-list li.note::before{ content:"❧"; position:absolute; left:0; color: var(--moss); }
  .journal-empty{ font-size: 12px; color: rgba(236,224,196,0.62); font-style: italic; }
  footer{ text-align:center; margin-top: 28px; font-size: 12px; color: rgba(236,224,196,0.5); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg viewBox="0 0 40 40">
        <path class="spark s1" d="M20 6 L20 14 M20 26 L20 34 M6 20 L14 20 M26 20 L34 20" />
        <path class="spark s2" d="M11 11 L15 15 M25 25 L29 29 M11 29 L15 25 M25 15 L29 11" />
        <circle cx="20" cy="20" r="5" fill="none" stroke="#d97a3d" stroke-width="2"/>
      </svg>
    </div>
    <h1>Avondgloren</h1>
    <div class="subtitle">een kleine magische winkel tussen de wortels van een oude eik</div>
    <div class="daytag" id="dayTag"></div>
  </header>

  <div class="layout">
    <div class="page">
      <p class="scene-label" id="sceneLabel">Voor openingstijd</p>
      <div class="story-text" id="storyText"></div>
      <div class="choices" id="choices"></div>
      <div class="restart-row" id="restartRow" style="display:none;">
        <button class="restart-btn" onclick="restart()">begin een nieuw seizoen ↺</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="side-card">
        <p class="side-title">Gloed</p>
        <div class="glow-track"><div class="glow-fill" id="glowFill"></div></div>
        <p class="glow-label" id="glowLabel">De winkel wordt net wakker.</p>
      </div>
      <div class="side-card">
        <p class="side-title">Spreukenboek</p>
        <ul class="journal-list" id="journalList"></ul>
        <p class="journal-empty" id="journalEmpty">Nog geen spreuk uitgesproken.</p>
      </div>
      <div class="side-card">
        <p class="side-title">Oma's dagboek</p>
        <ul class="journal-list" id="notebookList"></ul>
        <p class="journal-empty" id="notebookEmpty">Nog niets gevonden.</p>
      </div>
    </div>
  </div>

  </div>

<script>
// Avondgloren · State en story-helpers
// Wordt als eerste ingeladen: alles hieronder moet bestaan voor de scenes geladen worden.

const state = { gloed: 20, spreuken: [], dagboek: [], tags: [], flags: {} };

function tag(s, t){ s.tags.push(t); }

function unlockNote(s, key, text){
  if (s.flags['note_'+key]) return;
  s.flags['note_'+key] = true;
  s.dagboek.push(text);
}

// Wordt gevuld door de bestanden in src/story/.
const STORY = {};

// Avondgloren · Introductie
// Scenes worden aan het STORY-object toegevoegd; build.js voegt alle bestanden samen.

Object.assign(STORY, {

  intro_1: {
    label: "Avondgloren",
    text: [
      "Toen je oma vorige lente overleed, liet ze je niet alleen haar winkel na. Ze liet je ook een eigenzinnige lantaarn na, een plank vol kruiden met een eigen willetje, en klanten die al generaties lang de weg naar de oude eik weten te vinden. De lantaarn dooft trouwens nooit helemaal. Hij gloeit dof of helder, naargelang zijn humeur.",
      "Avondgloren is namelijk geen gewone winkel. Bezoekers uit heel Amberwoud komen er niet voor brood of naalden, maar voor iets kleiners: een beetje moed voor een spannend moment, een spreuk tegen een nare droom, of soms gewoon een reden om even niet alleen te zijn.",
      "Jij bent de nieuwe eigenaar. Een muis, net als je oma was, met haar aantekeningen nog overal tussen de potten verstopt (je hebt er tot nu toe slechts enkele gevonden) en met haar tovenaarshoed op je hoofd. Die is eigenlijk een maatje te groot voor je, maar je zet hem koppig toch op. Op de een of andere manier voel je je er zekerder door."
    ],
    choices: [ { text: "Ontgrendel de voordeur", next: "intro_2", leaf:"→" } ]
  },

  intro_2: {
    label: "Een nieuw seizoen",
    text: [
      "Het is nu een paar maanden later, begin herfst. Je kent de winkel inmiddels aardig, al wil de lantaarn 's ochtends soms nog steeds niet meteen opleven tot een warme gloed (dan moet je hem net als vroeger voorzichtig toespreken), en staan sommige potten er nog altijd zonder etiket bij.",
      "Vandaag is de eerste echt koude ochtend van het seizoen. Je adem hangt in wolkjes voor je gezicht als je de luiken opent, er ligt een dunne laag rijp op de bladeren voor de deur, en de wind rukt de laatste goudbruine blaadjes van de takken. Ergens buiten valt met een zacht getik een eikel tussen de wortels."
    ],
    choices: [ { text: "Begin de dag", next: "start", leaf:"→" } ]
  },

});

// Avondgloren · Openingsochtend
// Scenes worden aan het STORY-object toegevoegd; build.js voegt alle bestanden samen.

Object.assign(STORY, {

  start: {
    day: "Vroege herfst",
    label: "Voor openingstijd",
    text: [
      "Buiten hangt een lichte nevel over Amberwoud, en de wind waait goudbruine blaadjes tegen de luiken. Binnen is het stil, op het zachte getik van de avondlantaarn na. Die hangt aan een ketting boven de toonbank, precies zoals hij daar al hing toen je oma de winkel nog runde. Hij dooft nooit helemaal, maar gloeit sinds gisteravond dof en laag, alsof hij wacht tot iemand hem aanspoort tot iets warmers. Je veegt het stof van de hoed (oma's hoed, eigenlijk, nooit helemaal de jouwe geworden) en zet hem recht. Hij zakt toch weer scheef. Even denk je aan haar, zoals elke ochtend, en dan kijk je de winkel rond, en naar de bladeren die zich al tegen de drempel hebben opgehoopt.",
      "Je hebt een paar minuten voor de eerste klant voor de deur staat. Wat doe je eerst?"
    ],
    choices: [
      { text: "Moedig de avondlantaarn aan tot een warme gloed", next: "hearth", leaf:"✦" },
      { text: "Stal de nieuwe voorraad distelpluis en eikengal-inkt uit", next: "herbs", leaf:"❦" },
      { text: "Doe gewoon open: er wordt al ongeduldig op de stoep gewacht", next: "deur_vroeg", leaf:"🚪" }
    ]
  },

  hearth: {
    label: "De avondlantaarn",
    text: [
      "Je vouwt je pootjes om de lantaarn boven de toonbank en blaast er zachtjes tegenaan, niet om de vlam aan te wakkeren, maar om te laten weten dat je er bent, zoals je oma het altijd deed. De lantaarn sputtert, doet quasi-beledigd, en zakt dan in een warme, gelijkmatige gloed.",
      "\"Zo,\" zeg je. Hij tikt eenmaal, tevreden met zichzelf."
    ],
    onEnter: (s) => { s.flags.lanternKalm = true; s.gloed += 5; },
    choices: [ { text: "Loop naar de deur en draai het bordje om", next: "opening", leaf:"→" } ]
  },

  herbs: {
    label: "De voorraadplank",
    text: [
      "Je werkt de krat door: distelpluis, zilverig en licht als adem, goed om dingen buiten te houden die er niet horen te zijn: nachtmerries, tocht, pech. Ernaast eikengal-inkt, donker en traag drogend, gebruikt om een herinnering vast te leggen zodat die niet kan wegglippen.",
      "Je zet de potten op een rijtje in het licht van het open luik en voelt je, heel even, precies zo bekwaam als je oma altijd zei dat je zou worden."
    ],
    onEnter: (s) => { s.flags.kentIngredienten = true; s.gloed += 5; },
    choices: [ { text: "Loop naar de deur en draai het bordje om", next: "opening", leaf:"→" } ]
  },

  deur_vroeg: {
    label: "Een vroege klop",
    text: [
      "De lantaarn gloeit nog amper en je hebt nog niets uitgestald, maar buiten staat iemand ongeduldig te ijsberen, en het voelt onaardig om diegene op formaliteiten te laten wachten.",
      "Je doet open nog voordat het bordje is omgedraaid."
    ],
    onEnter: (s) => { s.gloed += 2; },
    choices: [ { text: "Kijk wie het is", next: "dag1_intro", leaf:"→" } ]
  },

  opening: {
    label: "Het bordje omdraaien",
    text: [
      "Je draait het houten bordje naar OPEN. Het klikt tegen de deurpost, een geluid dat het hele bos lijkt te herkennen.",
      "Je hoeft niet lang te wachten."
    ],
    choices: [ { text: "Kijk wie er is", next: "dag1_intro", leaf:"→" } ]
  },

});

// Avondgloren · Dag 1: Fen de kraai
// Scenes worden aan het STORY-object toegevoegd; build.js voegt alle bestanden samen.

Object.assign(STORY, {

  dag1_intro: {
    day: "Dag 1 &middot; Fen",
    label: "Een bekende paniek",
    text: [
      "Het is Fen, de kraai van de open plek. Hij komt niet zozeer binnenvliegen als wel naar binnen tuimelen, met een wervelwolk van natte, goudbruine blaadjes in zijn kielzog die meteen over de vloer verspreid raken. \"Ik heb het weer gedaan,\" kondigt hij aan, alsof je het al zou moeten weten. \"Mijn wintervoorraad. Verstopt op de meest geniale plek ooit. Zo geniaal dat ik hem nu zelf niet meer kan vinden.\"",
      "Hij ijsbeert over de toonbank, veren alle kanten op. \"De eerste sneeuw komt eraan! Ergens onder een geniale hoop bladeren liggen mijn wintervoorraden te verrotten en ik weet niet meer waar!\""
    ],
    choices: [
      { text: "Zet een kop kruidenthee met kamille", next: "fen_drank_thee", leaf:"☕" },
      { text: "Warm de amandelmelk met kaneel op", next: "fen_drank_amandel", leaf:"☕" },
      { text: "Warm de sojamelk met honing en nootmuskaat op", next: "fen_drank_soja", leaf:"☕" }
    ]
  },

  fen_drank_thee: {
    label: "Kruidenthee",
    text: [ "Fen neemt gehaast een slok, verbrandt meteen zijn tong, en drinkt onverstoorbaar door. \"Lekker,\" piept hij, ogen tranend van de hitte en misschien ook een beetje van de paniek." ],
    choices: [ { text: "Ga verder", next: "fen_na_drank", leaf:"→" } ]
  },
  fen_drank_amandel: {
    label: "Amandelmelk met kaneel",
    text: [ "Fen ruikt eraan, kijkt achterdochtig naar de kaneel, en drinkt het dan in één teug leeg. \"Zoet genoeg om iets te vergeten,\" merkt hij droogjes op, \"of juist te onthouden. We zien wel welke van de twee het wordt.\"" ],
    choices: [ { text: "Ga verder", next: "fen_na_drank", leaf:"→" } ]
  },
  fen_drank_soja: {
    label: "Sojamelk met honing en nootmuskaat",
    text: [ "Fen bekijkt het schuimlaagje wantrouwig, alsof het een boodschap voor hem verbergt. Na de eerste slok ontspannen zijn veren zichtbaar. \"Oké,\" geeft hij toe. \"Dit helpt al een beetje.\"" ],
    choices: [ { text: "Ga verder", next: "fen_na_drank", leaf:"→" } ]
  },

  fen_na_drank: {
    label: "Met de kop nog dampend",
    text: [ "Met de kop nog dampend tussen zijn veren laat Fen zich eindelijk op het bankje zakken." ],
    choices: [
      { text: "\"Rustig. Vertel me precies wat je je nog wél herinnert.\"", next: "fen_ask", leaf:"🗨" },
      { text: "Loop meteen naar de plank", next: "fen_spreuk", leaf:"→" }
    ]
  },

  fen_ask: {
    label: "Terugspoelen",
    text: [
      "Fen sluit zijn ogen, wat hem duidelijk moeite kost. \"Er was... een boom met een gespleten tak. En het rook er naar iets zoets. En ik dacht nog: dit onthoud ik nooit, dus ik verstop het extra goed.\" Hij kijkt je hulpeloos aan. \"Dat was, achteraf gezien, geen goed plan.\"",
      "Het geheugen is er dus nog wel, ergens. Alleen niet toegankelijk. Dat is iets heel anders dan compleet vergeten."
    ],
    onEnter: (s) => { s.flags.fenGevraagd = true; },
    choices: [ { text: "Loop naar de plank en kies iets", next: "fen_spreuk", leaf:"→" } ]
  },

  fen_spreuk: {
    label: "Bij de plank",
    text: [
      "Je kijkt naar de potten. Fen kijkt naar jou, met de blik van iemand die nu werkelijk alles zou proberen, inclusief dingen die niet bestaan."
    ],
    dynamicChoices: (s) => {
      const opts = [];
      if (s.flags.kentIngredienten){
        opts.push({ text: "Eikengal-inkt: bind de herinnering vast aan een veer die hij bij zich draagt", next: "fen_eind_inkt", leaf:"❦" });
        opts.push({ text: "Spiegeldauw: laat met een druppel het laatste heldere moment herleven", next: "fen_eind_dauw", leaf:"❦" });
      } else {
        opts.push({ text: "Pak iets dat naar helderheid ruikt, en hoop maar", next: "fen_eind_gok", leaf:"?" });
      }
      opts.push({ text: "Geen spreuk: speel gewoon samen hardop de ochtend van toen na", next: "fen_eind_praten", leaf:"✦" });
      return opts;
    }
  },

  fen_eind_inkt: {
    label: "Eikengal-inkt",
    text: [
      "Je laat Fen zijn eigen herinnering influisteren terwijl je hem met eikengal-inkt op een veer schrijft, niet de plek zelf maar het gevoel erbij: gespleten tak, geur van iets zoets, trots op zijn eigen sluwheid.",
      "\"Draag deze bij je,\" zeg je. \"Bij de juiste boom begint hij te kriebelen.\" Fen bekijkt de veer wantrouwig, alsof hij hem op heterdaad wil betrappen op niet-werken.",
      "Hij vliegt weg, veer stevig vastgeklemd, en je hoort hem in de verte al roepen: \"HIJ KRIEBELT. HIJ KRIEBELT ECHT.\" De lantaarn flakkert geamuseerd."
    ],
    onEnter: (s) => { s.gloed += 20; s.spreuken.push("Eikengal-veer: een herinnering die kriebelt bij de juiste plek."); tag(s,'geheugen'); },
    ending: true
  },

  fen_eind_dauw: {
    label: "Spiegeldauw",
    text: [
      "Je laat één druppel spiegeldauw op zijn snavelpunt vallen. Even wordt zijn blik glazig. Dan schiet zijn kop omhoog. \"De beuk! De beuk met de gespleten tak, naast de plek waar het naar honingzwam ruikt!\"",
      "\"Dat had je zelf ook geweten,\" zeg je, \"met een minuutje stilte.\" \"Ja, maar dit was sneller,\" zegt Fen, alweer bij de deur.",
      "Hij vliegt rakelings langs de avondlantaarn naar buiten, te opgewonden om te bedanken, wat voor Fen eigenlijk een compliment is."
    ],
    onEnter: (s) => { s.gloed += 20; s.spreuken.push("Spiegeldauw: één druppel om een heldere seconde terug te halen."); tag(s,'helderheid'); },
    ending: true
  },

  fen_eind_gok: {
    label: "Een gok",
    text: [
      "Je kent de kast nog niet goed genoeg om er slim gebruik van te maken, dus je pakt iets dat vaag naar dennennaald ruikt en geeft het hem mee, met een blik die meer hoop dan vertrouwen uitstraalt.",
      "Fen ruikt eraan, niest, en zegt dan: \"Weet je, daar moest ik ineens weer aan die ochtend denken.\" Of het de geur is of gewoon het feit dat iemand meedacht, blijft onduidelijk.",
      "Hij vliegt in elk geval opgewekter weg dan hij binnenkwam, wat voor vandaag genoeg lijkt."
    ],
    onEnter: (s) => { s.gloed += 10; s.spreuken.push("Een gok met dennengeur: niet feilloos, maar het hielp."); tag(s,'onzeker'); },
    ending: true
  },

  fen_eind_praten: {
    label: "Gewoon naspelen",
    text: [
      "Je slaat de plank helemaal over. In plaats daarvan laat je Fen de ochtend van het verstoppen naspelen, stap voor stap, vanaf het moment dat hij wakker werd tot het moment van geniale trots.",
      "Halverwege zijn eigen imitatie van zichzelf ('en toen dacht ik: DIT vergeet ik nooit, ha!') houdt hij ineens stil. \"De beuk. Het was de beuk.\"",
      "\"Zie je,\" zeg je. \"Je hoefde alleen maar jezelf serieus genoeg te nemen om het opnieuw te doorlopen.\" Fen kijkt je aan alsof je zojuist iets diepzinnigs hebt gezegd, in plaats van iets voor de hand liggends."
    ],
    onEnter: (s) => { s.gloed += 15; s.spreuken.push("Geen spreuk: alleen de ochtend hardop naspelen."); tag(s,'aanwezigheid'); },
    ending: true
  },

});

// Avondgloren · Dag 2: Jackie het konijn
// Scenes worden aan het STORY-object toegevoegd; build.js voegt alle bestanden samen.

Object.assign(STORY, {

  dag2_intro: {
    day: "Dag 2 &middot; Jackie",
    label: "Een grote eerste keer",

function berekenSignature(s){
  const telling = {};
  s.tags.forEach(t => { if (t === 'onzeker') return; telling[t] = (telling[t]||0)+1; });
  let beste = null, hoogste = 0;
  Object.keys(telling).forEach(k => { if (telling[k] > hoogste){ hoogste = telling[k]; beste = k; } });
  if (!beste) beste = 'aanwezigheid';
  return SIGNATURES[beste];
}

Object.keys(STORY).forEach(key => {

// Avondgloren · Engine (rendering, zijbalk, herstart)
// Wordt als laatste ingeladen en start het spel onderaan met render("intro_1").

let current = "start";

function glowText(w){
  if (w >= 90) return "De hele winkel voelt alsof hij hier altijd al heeft gestaan.";
  if (w >= 55) return "Het begint hier steeds meer op een thuis te lijken.";
  if (w >= 35) return "Er nestelt zich iets goeds in de winkel.";
  if (w >= 20) return "De winkel wordt net wakker.";
  return "Nog koud in de hoekjes.";
}

function renderLijst(id, emptyId, items, cls){
  const list = document.getElementById(id);
  const empty = document.getElementById(emptyId);
  list.innerHTML = "";
  if (items.length === 0){ empty.style.display = "block"; return; }
  empty.style.display = "none";
  items.forEach(entry => {
    const li = document.createElement('li');
    li.className = cls;
    li.innerHTML = entry;
    list.appendChild(li);
  });
}

function renderSidebar(){
  const pct = Math.max(0, Math.min(100, state.gloed));
  document.getElementById('glowFill').style.width = pct + "%";
  document.getElementById('glowLabel').textContent = glowText(state.gloed);
  renderLijst('journalList', 'journalEmpty', state.spreuken, 'spell');
  renderLijst('notebookList', 'notebookEmpty', state.dagboek, 'note');
}

function render(id){
  current = id;
  const node = STORY[id];
  if (node.onEnter) node.onEnter(state);

  document.getElementById('sceneLabel').textContent = node.label;
  document.getElementById('dayTag').textContent = node.day || "";

  let teksten = node.text.slice();
  if (node.endingSignature){
    const line = berekenSignature(state);
    teksten = teksten.map(t => t === "SIGNATURE_LINE" ? line : t);
  }

  const textEl = document.getElementById('storyText');
  textEl.innerHTML = teksten.map(p => `<p>${p}</p>`).join("");

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = "";
  const restartRow = document.getElementById('restartRow');

  const choiceList = node.dynamicChoices ? node.dynamicChoices(state) : (node.choices || []);

  if (node.ending || choiceList.length === 0){
    choicesEl.style.display = "none";
    restartRow.style.display = "block";
  } else {
    choicesEl.style.display = "flex";
    restartRow.style.display = "none";
    choiceList.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = "choice-btn";
      btn.innerHTML = `<span class="leaf">${choice.leaf || "&bull;"}</span>${choice.text}`;
      btn.onclick = () => render(choice.next);
      choicesEl.appendChild(btn);
    });
  }

  renderSidebar();
}

function restart(){
  state.gloed = 20;
  state.spreuken = [];
  state.dagboek = [];
  state.tags = [];
  state.flags = {};
  render("start");
}

render("intro_1");
